<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Unauthorized Device</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container text-center">
    <div class="card p-5 shadow">
        <h2 class="text-danger">Access Denied</h2>
        <p>Your device or portal ID is not registered in the system.</p>
        <div class="alert alert-warning">
            Expected ID: <strong>AU-WEB-PORTAL-TEST</strong>
        </div>
        <p class="small text-muted">Please add this record to the <strong>gwbattr</strong> table with type <strong>'TT'</strong>.</p>
    </div>
</div>
</body>
</html>
